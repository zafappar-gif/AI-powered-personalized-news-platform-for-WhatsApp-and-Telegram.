<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manchita — estudio 3D</title><style> *{box-sizing:border-box}body{margin:0;background:#f3e9df;color:#171514;font:15px system-ui}canvas{display:block;width:100%;height:100%;touch-action:none}#stage{height:100svh}header{position:absolute;top:24px;left:24px;pointer-events:none}h1{font: bold clamp(42px,8vw,100px)/.9 Georgia;margin:0}p{letter-spacing:.12em}nav{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:min(95%,650px)}button{border:1px solid #171514;border-radius:30px;padding:10px 16px;background:#f3e9df;color:#171514;cursor:pointer}button[aria-pressed=true]{background:#171514;color:white}#status{position:absolute;right:20px;top:20px;font-size:12px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="stage"></div><header><h1>Manchita.</h1><p>ESTUDIO DE PERSONAJE 3D</p></header><span id="status" role="status">Cargando escena…</span><nav aria-label="Animaciones"></nav><script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status');const scene=new T.Scene();scene.background=new T.Color('#f3e9df');const camera=new T.PerspectiveCamera(35,1,.1,100);camera.position.set(4,2.7,8);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;stage.append(renderer.domElement);const pm=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pm.fromScene(room,.04).texture;room.dispose();pm.dispose();const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.6,0);controls.enablePan=false;controls.minDistance=4;controls.maxDistance=13;controls.enableDamping=true;
scene.add(new T.HemisphereLight(0xffffff,0x8b7263,2));const key=new T.DirectionalLight(0xffffff,3);key.position.set(-3,6,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const floor=new T.Mesh(new T.PlaneGeometry(200,200),new T.MeshStandardMaterial({color:0xf3e9df,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ink=new T.MeshPhysicalMaterial({color:0x09090c,metalness:.12,roughness:.22,clearcoat:1,clearcoatRoughness:.13});const white=new T.MeshBasicMaterial({color:0xfffaf4});const root=new T.Group();scene.add(root);const torso=new T.Group();root.add(torso);
function mesh(g,m,p,parent=torso){const o=new T.Mesh(g,m);o.position.set(...p);o.castShadow=m===ink;parent.add(o);return o}
function oval(p,s,m=ink,parent=torso){const o=mesh(new T.SphereGeometry(1,40,28),m,p,parent);o.scale.set(...s);return o}
function tube(points,radii,parent=torso){const curve=new T.CatmullRomCurve3(points.map(p=>new T.Vector3(...p)));const n=48,k=20,frames=curve.computeFrenetFrames(n,false),pos=[],idx=[];for(let i=0;i<=n;i++){const t=i/n,p=curve.getPointAt(t),q=t*(radii.length-1),j=Math.min(radii.length-2,Math.floor(q)),r=T.MathUtils.lerp(radii[j],radii[j+1],q-j);for(let a=0;a<=k;a++){const th=a/k*Math.PI*2,v=p.clone().addScaledVector(frames.normals[i],Math.cos(th)*r).addScaledVector(frames.binormals[i],Math.sin(th)*r);pos.push(v.x,v.y,v.z);if(i<n&&a<k){const x=i*(k+1)+a;idx.push(x,x+1,x+k+1,x+1,x+k+2,x+k+1)}}}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();return mesh(g,ink,[0,0,0],parent)}
// continuous asymmetric torso, narrow waist and wide ink-splash head
const rings=[[.78,.16,.15,0],[1.02,.22,.20,.02],[1.32,.28,.24,.10],[1.58,.42,.32,.10],[1.85,.68,.45,.04],[2.13,.82,.52,-.04],[2.38,.73,.48,-.13],[2.58,.52,.34,-.25],[2.72,.22,.18,-.35],[2.77,.01,.01,-.36]];const pp=[],ii=[],N=64;for(let i=0;i<rings.length;i++){const [y,rx,rz,c]=rings[i];for(let j=0;j<=N;j++){const a=j/N*Math.PI*2;pp.push(c+rx*Math.cos(a)*(1+.09*Math.sin(3*a+i*.4)),y+.035*Math.sin(a*2),rz*Math.sin(a));if(i<rings.length-1&&j<N){const x=i*(N+1)+j;ii.push(x,x+N+1,x+1,x+1,x+N+1,x+N+2)}}}const bodyG=new T.BufferGeometry();bodyG.setAttribute('position',new T.Float32BufferAttribute(pp,3));bodyG.setIndex(ii);bodyG.computeVertexNormals();mesh(bodyG,ink,[0,0,0]);
tube([[-.48,2.46,0],[-.78,2.79,0],[-.64,3.12,0],[-.27,3.22,0],[.06,3.02,0],[.34,2.92,0]],[.29,.25,.19,.12,.055,.002]);tube([[-.52,2.03,0],[-.83,1.92,0],[-1.02,1.78,0],[-1.12,1.83,0]],[.31,.22,.12,.002]);
const eyes=[oval([-.24,2.16,.49],[.15,.30,.055],white),oval([.23,2.19,.49],[.14,.28,.055],white)];eyes[0].rotation.z=.19;eyes[1].rotation.z=.19;
const arms=[],legs=[];for(const s of [-1,1]){const a=new T.Group();a.position.set(s*.27,1.45,0);torso.add(a);tube([[0,0,0],[s*.38,-.12,0],[s*.52,-.35,.02],[s*.31,-.58,.12]],[.12,.10,.095,.12],a);oval([s*.31,-.58,.12],[.15,.17,.13],ink,a);arms.push(a);const l=new T.Group();l.position.set(s*.15,.98,0);root.add(l);tube([[0,0,0],[s*.08,-.35,0],[s*.20,-.72,.02],[s*.25,-.85,.12]],[.17,.13,.16,.22],l);oval([s*.26,-.85,.19],[.29,.13,.37],ink,l);legs.push(l)}
const puddle=oval([0,.035,0],[.72,.035,.48],ink,scene);const drops=[];for(let i=0;i<4;i++)drops.push(oval([0,0,0],[.055,.07,.055],ink,torso));
let state='idle',start=0;const states={idle:'Reposo',walk:'Camina',run:'Corre',jump:'Salta',wave:'Saluda',think:'Piensa',melt:'Se transforma'};const nav=document.querySelector('nav');for(const [id,label] of Object.entries(states)){const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-pressed',String(id===state));b.onclick=()=>{state=id;start=clock.getElapsedTime();for(const el of nav.children)el.setAttribute('aria-pressed',String(el===b))};nav.append(b)}const pointer=new T.Vector2();renderer.domElement.addEventListener('pointermove',e=>{pointer.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2)});const clock=new T.Clock();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)}addEventListener('resize',resize);resize();status.textContent='Arrastrá para girar';renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime(),u=t-start,w=state==='run'?10:5,move=state==='walk'||state==='run',f=reduced?0:1;root.position.y=f*(state==='jump'?Math.abs(Math.sin(u*2))* .85:move?Math.abs(Math.sin(u*w))*.09:0);root.rotation.y=f*.14*Math.sin(t*.8);torso.scale.set(1,1+f*.025*Math.sin(t*2),1);torso.rotation.z=f*(state==='think'?.18:move?-.12:.04*Math.sin(t*2));for(let i=0;i<2;i++){const s=i?1:-1;legs[i].rotation.x=f*(move?s*Math.sin(u*w)*.55:state==='jump'?-.2:0);arms[i].rotation.x=f*(move?-s*Math.sin(u*w)*.55:0);arms[i].rotation.z=f*(state==='wave'&&i===1?1.8+.35*Math.sin(u*7):state==='think'&&i===0?-1.1:0);eyes[i].scale.y=(i?.28:.30)*(1-f*.92*Math.pow(Math.max(0,Math.cos(t*1.3)),90));eyes[i].position.x=(i?.23:-.24)+pointer.x*.035;eyes[i].position.y=(i?2.19:2.16)+pointer.y*.035}const m=state==='melt'&&f?(1-Math.cos(u*2))/2:0;root.scale.set(1+m*.65,1-m*.88,1+m*.4);puddle.scale.x=.72+m*.8;drops.forEach((o,i)=>{const a=i*1.57+t*.5;o.position.set(Math.cos(a)*1.1,2.5+Math.sin(a*2)*.4,Math.sin(a)*.35);o.visible=!reduced});controls.update();renderer.render(scene,camera)});
</script></body></html>
